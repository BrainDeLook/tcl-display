name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system pytest pytest-asyncio aiohttp ruff
      - run: ruff check .
      - run: pytest -q tests/test_api.py
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system pytest-homeassistant-custom-component
      - run: pytest -q tests/test_homeassistant.py
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Zig 0.13.0
        shell: pwsh
        run: |
          Invoke-WebRequest https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath zig
      - name: Native display regression tests and application build
        shell: pwsh
        run: |
          $zig = "$PWD/zig/zig-windows-x86_64-0.13.0/zig.exe"
          ./windows/test.ps1 -Zig $zig
          ./windows/build.ps1 -Zig $zig -OutputDirectory "$PWD/dist"
